<!DOCTYPE html><html><head><meta charset="utf-8"><title>AV Organizer</title><script src="https://cdn.babylonjs.com/babylon.js"></script><script src="https://cdn.babylonjs.com/serializers/babylonjs.serializers.min.js"></script><style>body{margin:0;background:#0a0a0a;color:#fff;font-family:system-ui}#c{width:100vw;height:100vh;touch-action:none}.ui{position:fixed;top:70px;left:10px;background:#1a1a1a;padding:15px;border-radius:8px;max-width:300px;border:1px solid #7c3aed}.header{position:fixed;top:0;left:0;right:0;background:#1a1a1a;padding:15px;text-align:center;border-bottom:2px solid #7c3aed;font-size:24px;font-weight:bold;color:#7c3aed;z-index:100}.dimensions{position:fixed;bottom:20px;right:20px;background:rgba(26,26,26,0.9);padding:15px;border-radius:8px;border:1px solid #7c3aed;font-size:14px}.btn{background:#7c3aed;border:0;color:#fff;padding:8px 15px;border-radius:4px;cursor:pointer;margin:5px}.btn:hover{background:#6d28d9}.inp{background:#2a2a2a;border:1px solid #7c3aed;color:#fff;padding:5px;width:60px}label{display:block;margin:5px 0}.grid{display:grid;gap:2px;margin:10px 0;background:#2a2a2a;padding:5px;border-radius:4px}.cell{width:30px;height:30px;background:#3a3a3a;border:1px solid #4a4a4a;cursor:pointer}.selected{background:#7c3aed}</style></head><body><div class="header">AV Organizer</div><canvas id="c"></canvas><div class="ui"><div class="section"><h3>Размеры ячейки:</h3><label>Ширина (мм):<input type="number" id="cellWidth" class="inp" value="60" min="20" max="200"></label><label>Глубина (мм):<input type="number" id="cellDepth" class="inp" value="60" min="20" max="200"></label><label>Высота (мм):<input type="number" id="height" class="inp" value="50" min="10" max="200"></label></div><div class="section"><h3>Сетка:</h3><label>Строк:<input type="number" id="rows" class="inp" value="3" min="1" max="10"></label><label>Колонок:<input type="number" id="cols" class="inp" value="3" min="1" max="10"></label><div id="gridContainer" class="grid"></div></div><div class="section"><h3>Стенки:</h3><label>Внешние (мм):<input type="number" id="outerWall" class="inp" value="2"></label><label>Внутренние (мм):<input type="number" id="innerWall" class="inp" value="1.5"></label><label>Дно (мм):<input type="number" id="bottomWall" class="inp" value="1.5"></label></div><div><button class="btn" onclick="mergeCells()">Объединить</button><button class="btn" onclick="resetSelection()">Сбросить</button><button class="btn" onclick="generate()">Создать</button><button class="btn" onclick="exportSTL()">Экспорт STL</button></div></div><div id="dimensions" class="dimensions">Загрузка размеров...</div><script>
let scene,camera,engine,selectedCells=new Set(),mergedGroups=[],cellMeshes={};window.addEventListener('DOMContentLoaded',()=>{init();updateGrid();generate()});['cellWidth','cellDepth','height','rows','cols','outerWall','innerWall','bottomWall'].forEach(id=>{const el=document.getElementById(id);el.addEventListener('change',()=>{if(id==='rows'||id==='cols')updateGrid();generate()})});function updateGrid(){const rows=+document.getElementById('rows').value;const cols=+document.getElementById('cols').value;const grid=document.getElementById('gridContainer');grid.style.gridTemplateColumns=`repeat(${cols},30px)`;grid.innerHTML='';for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){const cell=document.createElement('div');cell.className='cell'+(selectedCells.has(`${r}_${c}`)?'selected':'');cell.dataset.row=r;cell.dataset.col=c;cell.onclick=()=>toggleGridCell(r,c);grid.appendChild(cell)}}}function toggleGridCell(row,col){const key=`${row}_${col}`;const cell=document.querySelector(`[data-row="${row}"][data-col="${col}"]`);if(selectedCells.has(key)){selectedCells.delete(key);cell.classList.remove('selected')}else{selectedCells.add(key);cell.classList.add('selected')}}function init(){const canvas=document.getElementById("c");engine=new BABYLON.Engine(canvas,true);scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color3(0.05,0.05,0.05);camera=new BABYLON.ArcRotateCamera("camera",0,Math.PI/3,400,BABYLON.Vector3.Zero(),scene);camera.attachControl(canvas,true);camera.setPosition(new BABYLON.Vector3(200,200,200));new BABYLON.HemisphericLight("light",new BABYLON.Vector3(1,1,0),scene);const pl=new BABYLON.PointLight("pointLight",new BABYLON.Vector3(0,200,-200),scene);pl.intensity=0.7;scene.environmentTexture=BABYLON.CubeTexture.CreateFromPrefilteredData("https://playground.babylonjs.com/textures/environment.dds",scene);engine.runRenderLoop(()=>scene.render());window.addEventListener('resize',()=>engine.resize())}function createPBRMaterial(color){const mat=new BABYLON.PBRMaterial("pbrMat",scene);mat.albedoColor=color;mat.metallic=0.8;mat.roughness=0.15;mat.microSurface=0.95;mat.usePhysicalLightFalloff=true;mat.environmentIntensity=0.9;mat.clearCoat.isEnabled=true;mat.clearCoat.intensity=0.8;mat.clearCoat.roughness=0.1;return mat}
function generate(){scene.meshes.slice().forEach(mesh=>mesh.dispose());cellMeshes={};const p={cellWidth:+document.getElementById("cellWidth").value,cellDepth:+document.getElementById("cellDepth").value,height:+document.getElementById("height").value,rows:+document.getElementById("rows").value,cols:+document.getElementById("cols").value,outerWall:+document.getElementById("outerWall").value,innerWall:+document.getElementById("innerWall").value,bottomWall:+document.getElementById("bottomWall").value};const totalWidth=p.cellWidth*p.cols+p.innerWall*(p.cols-1)+p.outerWall*2;const totalDepth=p.cellDepth*p.rows+p.innerWall*(p.rows-1)+p.outerWall*2;document.getElementById('dimensions').innerHTML=`Габариты:<br>Ширина: ${totalWidth.toFixed(1)}мм<br>Глубина: ${totalDepth.toFixed(1)}мм<br>Высота: ${p.height.toFixed(1)}мм`;const mainMat=createPBRMaterial(new BABYLON.Color3(0.3,0.1,0.5));const outerBox=BABYLON.MeshBuilder.CreateBox("outerBox",{width:totalWidth,height:p.height,depth:totalDepth},scene);outerBox.position.y=p.height/2;const innerBox=BABYLON.MeshBuilder.CreateBox("innerBox",{width:totalWidth-p.outerWall*2,height:p.height+1,depth:totalDepth-p.outerWall*2},scene);innerBox.position.y=p.height/2;let mainCSG=BABYLON.CSG.FromMesh(outerBox).subtract(BABYLON.CSG.FromMesh(innerBox));outerBox.dispose();innerBox.dispose();const startX=-totalWidth/2+p.outerWall;const startZ=-totalDepth/2+p.outerWall;const mergedMap=new Map();mergedGroups.forEach(group=>{group.forEach(cell=>{mergedMap.set(cell,group)})});function needWall(row1,col1,row2,col2){const cell1=`${row1}_${col1}`;const cell2=`${row2}_${col2}`;const group1=mergedMap.get(cell1);const group2=mergedMap.get(cell2);return!group1||!group2||group1!==group2}let internalWalls=[];for(let col=0;col<p.cols-1;col++){for(let row=0;row<p.rows;row++){if(needWall(row,col,row,col+1)){const vWall=BABYLON.MeshBuilder.CreateBox("vWall",{width:p.innerWall,height:p.height,depth:p.cellDepth+p.innerWall},scene);const x=startX+col*(p.cellWidth+p.innerWall)+p.cellWidth+p.innerWall/2;const z=startZ+row*(p.cellDepth+p.innerWall)+p.cellDepth/2;vWall.position.set(x,p.height/2,z);internalWalls.push(BABYLON.CSG.FromMesh(vWall));vWall.dispose()}}}for(let row=0;row<p.rows-1;row++){for(let col=0;col<p.cols;col++){if(needWall(row,col,row+1,col)){const hWall=BABYLON.MeshBuilder.CreateBox("hWall",{width:p.cellWidth+p.innerWall,height:p.height,depth:p.innerWall},scene);const x=startX+col*(p.cellWidth+p.innerWall)+p.cellWidth/2;const z=startZ+row*(p.cellDepth+p.innerWall)+p.cellDepth+p.innerWall/2;hWall.position.set(x,p.height/2,z);internalWalls.push(BABYLON.CSG.FromMesh(hWall));hWall.dispose()}}}for(let row=0;row<p.rows;row++){for(let col=0;col<p.cols;col++){const x=startX+col*(p.cellWidth+p.innerWall);const z=startZ+row*(p.cellDepth+p.innerWall);const cell=BABYLON.MeshBuilder.CreateBox(`cell_${row}_${col}`,{width:p.cellWidth,height:0.1,depth:p.cellDepth},scene);cell.position.set(x+p.cellWidth/2,0.05,z+p.cellDepth/2);cell.material=createCellMaterial(isSelected(row,col));cell.metadata={row,col,id:`${row}_${col}`};cellMeshes[`${row}_${col}`]=cell}}let finalCSG=mainCSG;internalWalls.forEach(wall=>{finalCSG=finalCSG.union(wall)});const base=BABYLON.MeshBuilder.CreateBox("base",{width:totalWidth,height:p.bottomWall,depth:totalDepth},scene);base.position.y=p.bottomWall/2;const baseCSG=BABYLON.CSG.FromMesh(base);base.dispose();finalCSG=finalCSG.union(baseCSG);const final=finalCSG.toMesh("final",mainMat,scene)}
function createCellMaterial(selected){const mat=new BABYLON.PBRMaterial("cellMat",scene);mat.albedoColor=selected?new BABYLON.Color3(1,1,0):new BABYLON.Color3(0.3,0.1,0.5);mat.alpha=selected?0.8:0.3;mat.metallic=0.8;mat.roughness=0.15;return mat}function isSelected(row,col){return selectedCells.has(`${row}_${col}`)}function isMerged(row1,col1,row2,col2){for(let group of mergedGroups){const cell1=`${row1}_${col1}`;const cell2=`${row2}_${col2}`;if(group.includes(cell1)&&group.includes(cell2))return true}return false}function mergeCells(){if(selectedCells.size<2)return;const newGroup=Array.from(selectedCells);mergedGroups.push(newGroup);selectedCells.clear();updateGrid();generate()}function resetSelection(){selectedCells.clear();mergedGroups=[];updateGrid();generate()}function exportSTL(){if(!scene.meshes.length)return;const options={binary:true,exportIndividualMeshes:false};const meshToExport=scene.meshes.find(mesh=>mesh.name==="final");if(!meshToExport)return;BABYLON.STLExport.CreateSTL([meshToExport],options)}</script></body></html>
